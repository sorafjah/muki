<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>左右と東西南北</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: map card on the left, question panel on the right; stacks on narrow screens */
:root{
  --bg:#eef8ff; --surface:#ffffff; --ink:#1d2a3a; --muted:#5b6b7b; --line:#cfe3ee;
  --tile:#d2f0bd; --road:#fff8ea; --bldg:#fff1d6; --accent:#1688d4; --accent-ink:#ffffff;
  --here:#e8463a; --goal:#22a55a; --mark:#7b5be0; --ok:#1e9a52; --ng:#d23c2e; --hl:#fff1a8;
  --font:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.9;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
ruby rt{font-size:.5em;font-weight:400;letter-spacing:0}
.app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
h1{font-size:26px;margin:0;line-height:1.6}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-left:auto}
.seg{display:flex;align-items:center;gap:6px}
.seg .lab{font-size:14px;color:var(--muted)}
.seg .grp{display:flex;border:2px solid var(--accent);border-radius:12px;overflow:hidden}
.seg button{min-height:48px;min-width:48px;padding:0 14px;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:17px;cursor:pointer;line-height:1.5}
.seg button+button{border-left:2px solid var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stage{position:relative;width:100%;max-width:620px;margin:0 auto;border-radius:10px;overflow:hidden;touch-action:manipulation}
.stage canvas{display:block;width:100%;height:auto}
.nsym{flex:none;width:80px;height:80px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.under{display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.q{font-size:21px;font-weight:700;line-height:2.1;margin:0;text-wrap:balance}
.sub{font-size:15px;color:var(--muted);margin:0}
.prog{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;align-items:center;padding:8px;border-radius:12px;background:#f5faff;border:2px dashed var(--line)}
.cmd{display:inline-flex;align-items:center;gap:6px;min-height:52px;padding:2px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font:inherit;font-size:17px;color:var(--ink);line-height:1.6}
.cmd .ic{font-size:24px;font-weight:700;color:var(--accent);line-height:1}
.cmd .no{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cmd.now{background:var(--hl);border-color:var(--accent)}
button.cmd{cursor:pointer}
.palette{display:flex;flex-wrap:wrap;gap:10px}
.palette .cmd{min-height:60px;font-size:18px;border-color:var(--accent)}
.empty{color:var(--muted);font-size:15px;padding:0 6px}
.cross{display:grid;grid-template-columns:repeat(3,minmax(0,96px));grid-template-areas:"nw n ne" "w c e" "sw s se";gap:8px;justify-content:center}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:440px;margin:0 auto}
.choices .ans{min-height:76px;font-size:26px}
.hint{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;background:#fff;border:3px solid;border-radius:12px;padding:0 8px;font-weight:700;font-size:22px;line-height:1.9;white-space:nowrap}
.hint ruby rt{font-size:.45em}
.hint.r{border-color:#1270b8;color:#1270b8}.hint.l{border-color:#d0620a;color:#d0620a}
.fxmark{position:absolute;left:50%;top:50%;width:34%;max-width:180px;aspect-ratio:1;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none}
.fxmark.on{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:.85;transform:translate(-50%,-50%) scale(1.04)}32%{transform:translate(-50%,-50%) scale(1)}70%{opacity:.85}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.cross.rel{grid-template-columns:repeat(3,minmax(0,128px))}
.cross.rel .ans{font-size:16px;line-height:1.7;padding:0 4px;white-space:nowrap}
.why{font-size:19px;margin:0;line-height:2.1}
.cross .c{grid-area:c;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:16px;font-weight:700;text-align:center;line-height:1.5}
.ans{min-height:64px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);font:inherit;font-size:24px;font-weight:700;cursor:pointer;line-height:1.5}
.ans:disabled{cursor:default;opacity:.55}
.ans.pick{background:var(--accent);color:var(--accent-ink);opacity:1}
.ans.right{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.row3{display:flex;gap:10px;flex-wrap:wrap}
.row3 .ans{flex:1;min-width:80px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;min-height:52px;padding:0 18px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font:inherit;font-size:18px;font-weight:700;cursor:pointer;line-height:1.6}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--here);outline-offset:2px}
.fb{font-size:22px;font-weight:700;margin:0;min-height:1.9em}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--ng)}
.score{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
*{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.playinfo{display:flex;align-items:center;gap:14px;margin-left:auto}
.qno{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.btn.small{min-height:44px;font-size:16px;padding:0 14px}
.btn.big{min-height:64px;font-size:24px;padding:0 40px}
.setup h2{font-size:24px;margin:0}
.start,.intro,.setup,.result{box-sizing:border-box}
.start{max-width:560px;margin:0 auto;width:100%}
.intro{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.ipage{min-height:350px;display:flex;flex-direction:column;gap:10px;align-items:center}
.ipage h2{font-size:24px;margin:0;text-align:center;text-wrap:balance}
.ipage svg.fig{width:100%;max-width:560px;height:auto;background:var(--bg);border-radius:14px}
.ipage .cap{margin:0;font-size:19px;text-align:center;max-width:34em}
.ipage .cap b{color:var(--accent)}
.inav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.skip{align-self:center;background:none;border:0;color:var(--muted);font:inherit;font-size:15px;text-decoration:underline;cursor:pointer;min-height:44px}
.ipage .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.ipage .pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:20px;border:2px solid var(--accent);font-size:15px;font-weight:700;color:var(--accent);background:var(--surface)}
.ipage .pill.on{background:var(--accent);color:#fff}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:2px}
.modes{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.mrow{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px;padding:6px 10px;border-radius:10px;background:var(--bg)}
.mrow b{color:var(--accent)}
.setup{display:flex;flex-direction:column;gap:14px;align-items:stretch;padding:20px}
.setup .seg{flex-direction:column;align-items:stretch;gap:4px;min-width:0}
.setup .seg .lab{font-size:15px;line-height:1.9;padding-top:6px}
.setup .grp{display:flex;width:100%}
.setup .grp button{flex:1;min-width:0;padding:0 4px;min-height:56px;font-size:18px;white-space:nowrap}
.pair{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.lvdesc{margin:0;font-size:16px;line-height:1.8;padding:6px 12px;border-radius:10px;background:var(--hl)}
.goes{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.goes .btn{width:100%}
.mapcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.tgls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;flex:1;min-width:0}
.tgl{min-height:44px;min-width:76px;padding:0 14px;border-radius:22px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font:inherit;font-size:15px;font-weight:700;cursor:pointer;line-height:1.6;display:inline-flex;align-items:center;gap:6px}
.tgl::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;box-sizing:border-box}
.tgl[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tgl[aria-pressed="true"]::before{background:currentColor}
.tgl#tView::before{display:none}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.result{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px;text-align:center}
.result h2{font-size:30px;margin:0}
.result .sc{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;margin:0}
.marks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.marks span{width:52px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:700;background:var(--bg);line-height:1.1}
.marks span small{font-size:12px;color:var(--muted);font-weight:400}
.marks .o{color:var(--here)}.marks .x{color:var(--accent)}
</style>

<div class="app">
  <header>
    <h1 class="f">{左右|さゆう}と{東西南北|とうざいなんぼく}</h1>
    <div class="playinfo" id="playinfo" hidden><span class="qno" id="qno"></span><button class="btn small" id="quit">やめる</button></div>
  </header>

  <section class="intro card" id="intro" hidden>
    <div class="ipage" id="ipage"></div>
    <div class="inav">
      <button class="btn" id="iprev">もどる</button>
      <div class="dots" id="idots"></div>
      <button class="btn main" id="inext">つぎへ</button>
    </div>
    <button class="skip f" id="iskip">{説明|せつめい}を とばす</button>
  </section>

  <section class="start" id="start" hidden>
    <div class="card setup">
      <h2 class="f">{問題|もんだい}を えらぼう</h2>
      <div class="seg"><span class="lab f">モード</span><div class="grp" id="modeG">
        <button data-v="A" class="f">A {予測|よそく}</button><button data-v="B" class="f">B {組|く}み{立|た}て</button><button data-v="C" class="f">C {方角|ほうがく}</button></div></div>
      <div class="seg"><span class="lab f">レベル</span><div class="grp" id="lvG">
        <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div>
      <p class="lvdesc" id="lvdesc"></p>
      <div class="pair">
        <div class="seg"><span class="lab f">{問題数|もんだいすう}</span><div class="grp" id="numG">
          <button data-v="4">4</button><button data-v="6">6</button><button data-v="8">8</button><button data-v="10">10</button></div></div>
        <div class="seg"><span class="lab f">{音|おと}</span><div class="grp" id="sndG">
          <button data-v="on" class="f">つける</button><button data-v="off" class="f">けす</button></div></div>
      </div>
      <div class="goes"><button class="btn main big f" id="go1">はじめる</button><button class="btn f" id="howto">あそびかたを {見|み}る</button></div>
    </div>
  </section>

  <section class="main" id="play" hidden>
    <div class="mapcol">
      <div class="card"><div class="stage" id="stage" role="img" aria-label="地図">
        <div class="hint r" id="hintR" hidden><ruby>右<rt>みぎ</rt></ruby></div><div class="hint l" id="hintL" hidden><ruby>左<rt>ひだり</rt></ruby></div>
        <svg class="fxmark" id="fxOk" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="36" fill="none" stroke="#f08a80" stroke-width="7"/></svg>
        <svg class="fxmark" id="fxNg" viewBox="0 0 100 100" aria-hidden="true"><path d="M24 24 L76 76 M76 24 L24 76" stroke="#7fb6e0" stroke-width="7" stroke-linecap="round"/></svg>
        <canvas class="confetti" id="conf"></canvas>
      </div></div>
      <div class="under">
        <div class="tgls">
          <button class="tgl" id="tView" aria-pressed="true">3D</button>
          <button class="tgl f" id="tHint" aria-pressed="false">{左右|さゆう}</button>
          <button class="tgl f" id="tLab" aria-pressed="true">{東西南北|とうざいなんぼく}</button>
        </div>
        <svg class="nsym" viewBox="-12 0 84 84" aria-label="方位記号（北）"><text x="30" y="11" text-anchor="middle" font-size="10" fill="var(--muted)">きた</text><text x="30" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">北</text><path d="M31 35 L17 58 L46 58" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="31" y1="35" x2="31" y2="80" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><line x1="18" y1="68" x2="44" y2="68" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="panel card" id="panel"></div>
  </section>

  <section class="card result" id="result" hidden></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
(()=>{
const F=s=>s.replace(/\{([^|}]+)\|([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
document.querySelectorAll('.f').forEach(e=>e.innerHTML=F(e.innerHTML));
const DIR=[{k:'北',y:'きた'},{k:'東',y:'ひがし'},{k:'南',y:'みなみ'},{k:'西',y:'にし'}];
const DF=d=>F(`{${DIR[d].k}|${DIR[d].y}}`);
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const CMD={F:{ic:'↑',t:'{前|まえ}へ{進|すす}む'},R:{ic:'↱',t:'{右|みぎ}を{向|む}く'},L:{ic:'↰',t:'{左|ひだり}を{向|む}く'}};
const C=64,M=60;
const ri=n=>Math.floor(Math.random()*n), pick=a=>a[ri(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion: reduce)').matches?Math.min(ms,150):ms));

const S={num:4,qi:0,res:[],mode:'A',level:1,labels:true,view:'3D',hint:false,snd:true,score:0,total:0,q:null,busy:false,done:false,prog:[],tries:0};
try{const s=JSON.parse(localStorage.getItem('hougaku-navi')||'{}');Object.assign(S,{snd:s.snd!==false,hint:!!s.hint,mode:['A','B','C'].includes(s.mode)?s.mode:'A',level:s.level||1,labels:s.labels!==false,view:s.view==='2D'?'2D':'3D'})}catch(e){}
const save=()=>{try{localStorage.setItem('hougaku-navi',JSON.stringify({snd:S.snd,hint:S.hint,mode:S.mode,level:S.level,labels:S.labels,view:S.view}))}catch(e){}};

const key=(x,y)=>x+','+y;
function sim(prog,x,y,d,n,obs){
  const path=[[x,y]];
  for(const c of prog){
    if(c==='R')d=(d+1)%4; else if(c==='L')d=(d+3)%4;
    else{const nx=x+DX[d],ny=y+DY[d];
      if(nx<0||ny<0||nx>=n||ny>=n||(obs&&obs.has(key(nx,ny))))return{x,y,d,ok:false,path};
      x=nx;y=ny;path.push([x,y]);}
  }
  return{x,y,d,ok:true,path};
}
function bfs(q){
  const st=[[q.x,q.y,q.d,0]],seen=new Set([q.x+','+q.y+','+q.d]);
  while(st.length){const [x,y,d,k]=st.shift();
    if(x===q.gx&&y===q.gy)return k;
    const nx=[[x+DX[d],y+DY[d],d],[x,y,(d+1)%4],[x,y,(d+3)%4]];
    for(const [a,b,e] of nx){
      if(a<0||b<0||a>=q.n||b>=q.n||q.obs.has(key(a,b)))continue;
      const s=a+','+b+','+e; if(seen.has(s))continue; seen.add(s); st.push([a,b,e,k+1]);}
  }
  return -1;
}

function genA(lv){
  if(lv===1)return{type:'A',lv,n:5,x:2,y:2,d:ri(4),prog:[pick(['R','L'])],obs:new Set(),ask:'dir'};
  if(lv===2){
    for(;;){const turns=Array.from({length:2+ri(2)},()=>pick(['R','L']));
      const prog=[...turns];const fs=ri(3);for(let i=0;i<fs;i++)prog.splice(ri(prog.length+1),0,'F');
      const q={type:'A',lv,n:5,x:2,y:2,d:ri(4),prog,obs:new Set(),ask:'dir'};
      if(sim(prog,q.x,q.y,q.d,5).ok)return q;}
  }
  const n=6;
  for(;;){
    const len=5+ri(2),prog=[];for(let i=0;i<len;i++)prog.push(i===0?'F':pick(['F','F','R','L']));
    const nt=prog.filter(c=>c!=='F').length,nf=len-nt; if(nt<2||nf<2)continue;
    const q={type:'A',lv,n,x:ri(n),y:ri(n),d:ri(4),prog,obs:new Set(),ask:'pos'};
    const r=sim(prog,q.x,q.y,q.d,n); if(!r.ok||(r.x===q.x&&r.y===q.y))continue;
    const cands=[[r.x,r.y]];
    const mir=sim(prog.map(c=>c==='R'?'L':c==='L'?'R':c),q.x,q.y,q.d,n);
    const back=sim(prog,q.x,q.y,(q.d+2)%4,n);
    const noTurn=sim(prog.filter(c=>c==='F'),q.x,q.y,q.d,n);
    const add=(p)=>{if(!p||cands.length>=3)return;if(p[0]<0||p[1]<0||p[0]>=n||p[1]>=n)return;
      if(p[0]===q.x&&p[1]===q.y)return;if(cands.some(c=>c[0]===p[0]&&c[1]===p[1]))return;cands.push(p)};
    for(const s of [mir,back,noTurn])if(s.ok)add([s.x,s.y]);
    let g=0;while(cands.length<3&&g++<50)add([r.x+ri(5)-2,r.y+ri(5)-2]);
    if(cands.length<3)continue;
    const labels=shuffle(['ア','イ','ウ']);
    q.marks=cands.map((c,i)=>({x:c[0],y:c[1],l:labels[i],ok:i===0}));
    return q;
  }
}
function genB(lv){
  if(lv===1){const k=1+ri(3),m=1+ri(2),s=pick([1,-1]);
    const q={type:'B',lv,n:5,x:2,y:4,d:0,gx:2+s*m,gy:4-k,obs:new Set(),max:8};q.min=bfs(q);return q;}
  const n=lv===3?6:5;
  for(;;){
    const obs=new Set();
    if(lv===3)while(obs.size<7)obs.add(key(ri(n),ri(n)));
    const q={type:'B',lv,n,x:ri(n),y:ri(n),d:ri(4),gx:ri(n),gy:ri(n),obs,max:lv===3?12:10};
    if(obs.has(key(q.x,q.y))||obs.has(key(q.gx,q.gy)))continue;
    if(Math.abs(q.x-q.gx)+Math.abs(q.y-q.gy)<2)continue;
    const k=bfs(q); if(k<0)continue;
    if(lv===2&&(k<4||k>7))continue;
    if(lv===3&&(k<6||k>10))continue;
    q.min=k;return q;
  }
}

const stage=document.getElementById('stage');
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#888';
const H=Math.PI/2;
let R3,scene,cam,cam3,cam2,boardG,labelsG,trailG,me,parts;
const T={from:null,to:null,t0:0,dur:450,shake:0,walk:0};

const hR=document.getElementById('hintR'),hL=document.getElementById('hintL');

function proj(v){const p=v.clone().project(cam),w=R3.domElement.clientWidth,h=R3.domElement.clientHeight;return{x:(p.x+1)/2*w,y:(1-p.y)/2*h};}
function updHint(){
  const show=S.hint&&me.visible;hR.hidden=hL.hidden=!show;
  handR.color.set(show?'#1270b8':'#f2c9a0');handL.color.set(show?'#d0620a':'#f2c9a0');
  if(!show)return;
  const sc=me.scale.x,r=me.rotation.y,rx=Math.cos(r),rz=-Math.sin(r);
  const base=me.position.clone(),mid=base.clone().add(new THREE.Vector3(0,0.55*sc,0));
  const C=proj(mid),top=proj(base.clone().add(new THREE.Vector3(0,1.15*sc,0))),bot=proj(base);
  const halfH=Math.abs(bot.y-top.y)/2;
  for(const [el,sg] of [[hR,1],[hL,-1]]){
    const P=proj(mid.clone().add(new THREE.Vector3(rx*sg*0.7,0,rz*sg*0.7)));
    let dx=P.x-C.x,dy=P.y-C.y,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len,need=Math.abs(uy)>0.5?halfH+30:Math.max(len,halfH*0.55+34);
    const d=Math.max(len,need);
    el.style.left=(C.x+ux*d)+'px';el.style.top=(C.y+uy*d)+'px';
  }
}
function resize(){if(!stage.clientWidth)return;const w=stage.clientWidth,h=Math.round(w*(S.view==='2D'?1:0.82));R3.setSize(w,h);cam3.aspect=w/h;cam3.updateProjectionMatrix();if(S.q)aimCam();}
function aimCam(){const n=S.q.n;

    cam2.left=-f*Math.max(a,1);cam2.right=f*Math.max(a,1);cam2.top=f/Math.min(a,1);cam2.bottom=-f/Math.min(a,1);
    const ph=(S.q.rot||0)*Math.PI/180;
    cam2.position.set(0,30,0);cam2.up.set(-Math.sin(ph),0,-Math.cos(ph));cam2.lookAt(0,0,0);cam2.updateProjectionMatrix();}

function tick(now,dt){
  if(!S.q)return;
  let p=1;
  if(T.to){p=Math.min((now-T.t0)/T.dur,1);const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    me.position.x=T.from.x+(T.to.x-T.from.x)*e;me.position.z=T.from.z+(T.to.z-T.from.z)*e;
    me.rotation.y=T.from.r+(T.to.r-T.from.r)*e;
    if(p>=1)T.to=null;}
  const walking=T.to&&T.moving;
  T.walk=walking?T.walk+dt*14:T.walk*0.8;
  const sw=walking?Math.sin(T.walk)*0.6:0;
  parts.legL.rotation.x=sw;parts.legR.rotation.x=-sw;parts.armL.rotation.x=-sw*0.8;parts.armR.rotation.x=sw*0.8;
  me.position.y=walking?Math.abs(Math.sin(T.walk))*0.04:0;
  if(T.shake>0){T.shake-=dt;const k=Math.sin(T.shake*60)*0.05;me.position.x+=k*Math.cos(me.rotation.y);}
  updHint();
}

function placeMe(instant){

  const to={x:wx(S.px),z:wz(S.py),r:-S.ang*Math.PI/180};
  if(instant){T.to=null;me.position.set(to.x,0,to.z);me.rotation.y=to.r;return;}
  T.from={x:me.position.x,z:me.position.z,r:me.rotation.y};
  T.moving=Math.abs(to.x-T.from.x)+Math.abs(to.z-T.from.z)>0.01;
  T.to=to;T.t0=performance.now();T.dur=matchMedia('(prefers-reduced-motion: reduce)').matches?120:450;
}
function bumpMe(){T.shake=0.35;}
function resetMe(){const q=S.q;S.px=q.x;S.py=q.y;S.pd=q.d;S.ang=q.d*90;S.trail=[[q.x,q.y]];placeMe(true);setTrail();}
function setTrail(){

  for(let i=1;i<S.trail.length;i++){const [a,b]=S.trail[i-1],[c,d]=S.trail[i];

    seg.position.set((wx(a)+wx(c))/2,0.035,(wz(b)+wz(d))/2);trailG.add(seg);}
  scene.add(trailG);

async function run(prog,cardSel){
  const q=S.q;
  for(let i=0;i<prog.length;i++){
    document.querySelectorAll(cardSel).forEach((e,j)=>e.classList.toggle('now',j===i));
    const c=prog[i];
    if(c==='R'){S.pd=(S.pd+1)%4;S.ang+=90;}
    else if(c==='L'){S.pd=(S.pd+3)%4;S.ang-=90;}
    else{const nx=S.px+DX[S.pd],ny=S.py+DY[S.pd];
      if(nx<0||ny<0||nx>=q.n||ny>=q.n||q.obs.has(key(nx,ny))){
        bumpMe();await sleep(450);document.querySelectorAll(cardSel).forEach(e=>e.classList.remove('now'));return{bump:true,at:i};}
      S.px=nx;S.py=ny;S.trail.push([nx,ny]);setTrail();}
    placeMe(false);
    await sleep(600);
  }
  document.querySelectorAll(cardSel).forEach(e=>e.classList.remove('now'));
  return{bump:false};
}

      return{type:'C',kind:'from',lv,n,x:0,y:0,d:0,obs,blds:B,from:A,to:Bb,ans,choices,dirs:lv===2?8:4};

  return{type:'C',kind:'turn',lv,n,x:2,y:2,d,t,k:2,obs:new Set(),dirs:4,land:{x:2+DX[t]*2,y:2+DY[t]*2,name:L[0],kana:L[1]},showLand:false};

function confetti(){
  const r=confCv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio,2);confCv.width=r.width*dpr;confCv.height=r.height*dpr;
  const W=r.width,Hh=r.height,cols=['#e8463a','#f2b632','#22a55a','#1688d4','#7b5be0','#f28a46','#ff7eb6'];
  for(let i=0;i<90;i++){const left=i%2===0,sp=Hh*(1.55+Math.random()*0.5);
    const ang=(left?-1:1)*(0.18+Math.random()*0.42);
    confP.push({x:left?W*0.12:W*0.88,y:Hh+6,vx:Math.sin(ang)*sp*-1*(left?-1:1)*(left?1:-1)*(left?1:1),vy:-Math.cos(ang)*sp,
      w:7+Math.random()*6,h:10+Math.random()*8,rot:Math.random()*6,vr:(Math.random()-.5)*14,ph:Math.random()*6,c:cols[i%cols.length],life:0});
    const p=confP[confP.length-1];p.vx=(left?1:-1)*Math.abs(Math.sin(ang))*sp;}
  if(!confRun){confRun=true;let last=performance.now();

      g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,Hh);

        p.x+=(p.vx+Math.sin(p.life*6+p.ph)*30*(p.vy>0?1:0))*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
        g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.scale(1,Math.cos(p.life*9+p.ph));g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore();}
      if(confP.length)requestAnimationFrame(step);else{confRun=false;g.clearRect(0,0,W,Hh);}};

}

  document.getElementById('idots').innerHTML=PAGES.map((_,i)=>`<i class="${i===ip?'on':''}"></i>`).join('');
  document.getElementById('iprev').style.visibility=ip?'visible':'hidden';
  document.getElementById('inext').innerHTML=last?F('{問題|もんだい}をえらぶ'):F('つぎへ');
}
